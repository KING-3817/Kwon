<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Image Draw</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#fff;color:#111;font-family:Arial,"Noto Sans KR",sans-serif}
.app{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.missing-files{position:absolute;top:6px;left:6px;z-index:100;max-width:calc(100% - 12px);display:none;flex-direction:column;color:red;font-size:12px;font-weight:700;line-height:1.25;word-break:break-all;text-shadow:0 0 2px #fff,0 0 4px #fff;pointer-events:none}
.animation-box{width:100%;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.image-wrap{position:relative;width:min(85%,400px);display:flex;align-items:flex-end;justify-content:center;overflow:visible}
#image{width:100%;height:auto;display:block;object-fit:contain;transform:scaleY(1);transform-origin:center bottom;will-change:transform;backface-visibility:hidden}
.side-animation{position:absolute;top:34%;width:34%;height:auto;z-index:3;display:none;object-fit:contain;pointer-events:none;opacity:0;transform:translateX(var(--side-shift,0%))}
#sideLeft{left:0}#sideRight{right:0}
.side-animation.show{display:block;animation:sidePop .3s ease-out forwards}
.hidden-background-effect{position:absolute;inset:-8%;z-index:4;display:none;border-radius:24px;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,210,70,.55) 35%,rgba(255,70,0,.2) 65%,transparent 78%);opacity:0}
.hidden-background-effect.l-effect{background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,55,55,.7) 35%,rgba(120,0,0,.35) 65%,transparent 78%)}
.hidden-background-effect.active{display:block;animation:hiddenGlow 7s ease-in-out forwards}
.comment-image{position:absolute;left:8%;width:84%;height:auto;z-index:7;display:none;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));opacity:0}
#comment1{top:6%}#comment2{top:43%}#comment3{bottom:6%}
.comment-image.show{display:block;animation:commentPop .32s ease-out forwards}
.draw-box{width:100%;height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#rouletteImage{width:100%;height:100%;display:block;object-fit:contain;user-select:none;cursor:pointer}
#drawButton{width:100%;height:54px;border:0;border-radius:14px;background:#111;color:#fff;font-size:18px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
#drawButton:active{transform:scale(.98)}#drawButton:disabled{opacity:.45}
.result{min-height:24px;font-size:16px;font-weight:700;text-align:center}
.probability-table{width:100%;border-collapse:collapse;font-size:10px;text-align:center}
.probability-table caption{margin-bottom:2px;font-size:10px;font-weight:700}
.probability-table th,.probability-table td{padding:2px 3px;border:1px solid #e5e5e5;line-height:1.1}
.probability-table th{background:#f4f4f4;font-weight:700}
.probability-table tbody tr{cursor:pointer}.probability-table tbody tr:active{background:#eee}
.flash{position:absolute;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none}
.flash.active{animation:flashEffect 120ms ease-out}
.explosion{position:absolute;inset:-35%;z-index:8;display:none;pointer-events:none;background:radial-gradient(circle,#fff 0 8%,#ffd84d 10% 16%,#ff7b00 18% 25%,transparent 27%);filter:drop-shadow(0 0 12px #ff5e00)}
.explosion.active{display:block;animation:explode .7s ease-out forwards}
@keyframes hiddenGlow{0%,100%{opacity:0;transform:scale(.8)}15%{opacity:.85;transform:scale(1)}85%{opacity:.45;transform:scale(1.08)}}
@keyframes commentPop{0%{opacity:0;transform:scale(.65)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes sidePop{0%{opacity:0;transform:scale(.65) translateX(var(--side-shift,0%))}70%{opacity:1;transform:scale(1.06) translateX(var(--side-shift,0%))}100%{opacity:1;transform:scale(1) translateX(var(--side-shift,0%))}}
@keyframes flashEffect{0%{opacity:0}35%{opacity:.95}100%{opacity:0}}
@keyframes explode{0%{opacity:0;transform:scale(.1) rotate(0)}20%{opacity:1;transform:scale(.65) rotate(25deg)}100%{opacity:0;transform:scale(1.8) rotate(90deg)}}
</style>
</head>
<body>
<div class="app">
<div id="missingFiles" class="missing-files"></div>
<div class="animation-box"><div class="image-wrap">
<div id="hiddenBackgroundEffect" class="hidden-background-effect"></div>
<img id="image" alt=""><img id="sideLeft" class="side-animation" alt=""><img id="sideRight" class="side-animation" alt="">
<img id="comment1" class="comment-image" alt=""><img id="comment2" class="comment-image" alt=""><img id="comment3" class="comment-image" alt="">
<div id="flash" class="flash"></div><div id="explosion" class="explosion"></div>
</div></div>
<div class="draw-box"><img id="rouletteImage" alt=""></div>
<button id="drawButton">뽑기</button>
<div id="result" class="result">항목을 뽑아보세요</div>
<table class="probability-table"><caption>확률표</caption><thead><tr><th>항목</th><th>확률</th><th>항목</th><th>확률</th><th>항목</th><th>확률</th></tr></thead><tbody id="probabilityBody"></tbody></table>
</div>
<script>
const items=[
{name:"제로투",displayName:"히든",tableName:"???",probability:1,frames:[1,2],audio:"히든.m4a",noPreview:true},
{name:"L을 가져가",probability:3,frames:[1,2],explode:true},
{name:"크림 치즈 허니",probability:5,frames:[1,2]},
{name:"라운드 & 라운드",probability:5.5,frames:[1,2,3,4]},
{name:"측면 대 측면",probability:5.5,frames:[1,2,3,4]},
{name:"셀카",probability:6.5,frames:[1,2,2,"FLASH",2]},
{name:"당신에게서",probability:7,frames:[1,2,1,3,4,2,1,2,4,3]},
{name:"크리스 크로스",probability:7.5,frames:[1,2]},
{name:"야채",probability:8,frames:[1,2,1,3,2,1,2,4]},
{name:"움직임 선보이기",probability:9.5,frames:[1,2]},
{name:"탱고",probability:11.5,frames:[1]},
{name:"스텝 댄싱",probability:14,frames:[1,2]},
{name:"팁 토",probability:16,frames:[1,2]}
];

const names=items.map(x=>x.name),seqs=Object.fromEntries(items.map(x=>[x.name,x.frames])),total=items.reduce((a,x)=>a+x.probability,0),DIR="./";
const $=id=>document.getElementById(id),missing=$("missingFiles"),missingSet=new Set(),imgCache=new Map(),audioCache=new Map();

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function miss(file){if(missingSet.has(file))return;missingSet.add(file);missing.innerHTML=[...missingSet].map(x=>`<div>${esc(x)}</div>`).join("");missing.style.display="flex"}
function getImg(key,path){
  if(!imgCache.has(key)){
    const x=new Image();
    x.onerror=()=>miss(path.split("/").pop());
    x.src=path;
    imgCache.set(key,x)
  }
  return imgCache.get(key)
}
const preview=n=>getImg("p:"+n,`${DIR}${n}.png`);
const frame=(n,f)=>getImg("f:"+n+":"+f,`${DIR}${n}${f}.png`);
const comment=n=>getImg("c:"+n,`${DIR}댓글${n}.png`);

items.forEach(x=>{
  if(!x.noPreview)preview(x.name);
  x.frames.filter(f=>f!=="FLASH").forEach(f=>frame(x.name,f));
  const a=x.audio||x.name+".m4a";
  if(!audioCache.has(a)){
    const au=new Audio();
    au.preload="metadata";
    au.onerror=()=>miss(a);
    au.src=DIR+a;
    au.load();
    audioCache.set(a,au)
  }
});
[1,2,3].forEach(comment);

const roulette=$("rouletteImage"),button=$("drawButton"),result=$("result"),image=$("image"),flash=$("flash"),explosion=$("explosion"),bg=$("hiddenBackgroundEffect"),left=$("sideLeft"),right=$("sideRight"),comments=[$("comment1"),$("comment2"),$("comment3")],body=$("probabilityBody");

body.innerHTML=Array.from({length:Math.ceil(items.length/3)},(_,r)=>{
  return `<tr>${items.slice(r*3,r*3+3).map(x=>`<td data-name="${esc(x.name)}">${esc(x.tableName||x.name)}</td><td data-name="${esc(x.name)}">${x.probability}%</td>`).join("")}</tr>`
}).join("");

const clicks=new Map();
body.onclick=e=>{
  const c=e.target.closest("[data-name]");
  if(!c)return;
  const n=c.dataset.name,cnt=(clicks.get(n)||0)+1;
  clicks.set(n,cnt);
  if(cnt>=10){forcedNext=n;clicks.set(n,0)}
};

const show=(el,img)=>{el.hidden=false;el.src=img.src},hide=el=>{el.hidden=true;el.removeAttribute("src")};
let running=false,selected=0,currentItem=null,forcedNext=null,activeAudio=null,fastFade=false,prepared=null,retryTimer=null,hiddenRun=0;

show(roulette,preview(names[1]));

function randomIndex(){
  if(forcedNext!==null){const n=forcedNext;forcedNext=null;return names.indexOf(n)}
  let v=Math.random()*total;
  return items.findIndex(x=>(v-=x.probability)<0)
}

button.onclick=()=>{
  if(running)return;
  fadeOut();
  hiddenRun++;
  running=true;
  button.disabled=true;
  result.textContent="뽑는 중...";
  selected=randomIndex();
  prepareAudio(items[selected]);
  rouletteRun()
};

roulette.onclick=()=>{
  if(running||!currentItem||activeAudio)return;
  fadeOut();
  hiddenRun++;
  startResult(currentItem,true)
};

function rouletteRun(){
  const totalSpin=18;
  let count=0,index=Math.floor(Math.random()*names.length);
  function next(){
    if(count<totalSpin){
      index=(index+1)%names.length;
      const x=items[index];
      x.noPreview?hide(roulette):show(roulette,preview(x.name));
      count++;
      return setTimeout(next,20+Math.pow(count/totalSpin,2.8)*220)
    }
    const x=items[selected];
    currentItem=x;
    x.noPreview?hide(roulette):show(roulette,preview(x.name));
    result.textContent=x.displayName||x.name;
    setTimeout(()=>{startResult(x);running=false;button.disabled=false},250)
  }
  next()
}

function createAudio(name){
  const a=new Audio(DIR+name);
  a.onerror=()=>miss(name);
  return a
}

function startResult(item){
  left.classList.remove("show");
  right.classList.remove("show");
  if(item.explode){explode();bgEffect("l")}
  const hidden=item.name==="제로투",def=!item.audio,name=item.audio||item.name+".m4a";
  const a=prepared&&prepared.name===item.name?prepared.audio:createAudio(name);
  prepared=null;
  a.loop=false;
  a.volume=def?0:1;
  activeAudio=a;
  fastFade=def;
  a.onended=()=>{if(a===activeAudio)activeAudio=null;finish()};
  a.currentTime=0;
  a.play().then(()=>{clearInterval(retryTimer);if(def)fadeIn(a)}).catch(()=>retry(a,def));

  if(hidden){
    image.hidden=false;
    image.style.visibility="hidden";
    image.src=frame(item.name,1).src;
    hiddenPrelude();
    const run=hiddenRun;
    setTimeout(()=>{
      if(run!==hiddenRun)return;
      image.style.visibility="visible";
      startAnimation(item.name);
      explode();
      comments.forEach(x=>x.classList.remove("show"));
      bg.classList.remove("active")
    },7000);
    setTimeout(()=>run===hiddenRun&&side(left,"L을 가져가"),9000);
    setTimeout(()=>run===hiddenRun&&side(right,"크림 치즈 허니"),12500);
    return
  }
  image.hidden=false;
  image.style.visibility="visible";
  startAnimation(item.name)
}

function side(el,name){
  el.src=frame(name,1).src;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  let n=2;
  const t=setInterval(()=>{
    if(!el.classList.contains("show"))return clearInterval(t);
    el.src=frame(name,n).src;
    n=n===2?1:2
  },450)
}

function retry(a,def){
  clearInterval(retryTimer);
  retryTimer=setInterval(()=>a.play().then(()=>{clearInterval(retryTimer);if(def)fadeIn(a)}).catch(()=>{}),400)
}
function prepareAudio(item){
  const name=item.audio||item.name+".m4a",a=createAudio(name);
  a.loop=false;a.volume=0;a.preload="auto";
  prepared={name:item.name,audio:a};
  a.play().then(()=>clearInterval(retryTimer)).catch(()=>retry(a,!item.audio))
}
function finish(){running=false;button.disabled=false}
function fadeIn(a){
  const t=performance.now(),f=n=>{
    if(a!==activeAudio)return;
    a.volume=Math.min((n-t)/220,1);
    if(a.volume<1)requestAnimationFrame(f)
  };
  requestAnimationFrame(f)
}
function fadeOut(){
  if(!activeAudio)return;
  const a=activeAudio,d=fastFade?420:650,s=a.volume,t=performance.now();
  activeAudio=null;fastFade=false;
  const f=n=>{
    const p=Math.min((n-t)/d,1);
    a.volume=Math.max(0,s*(1-p));
    if(p<1)requestAnimationFrame(f);
    else{a.pause();a.currentTime=0;a.volume=1}
  };
  requestAnimationFrame(f)
}
function bgEffect(type){
  bg.classList.remove("active","l-effect");
  if(type==="l")bg.classList.add("l-effect");
  void bg.offsetWidth;
  bg.classList.add("active")
}
function hiddenPrelude(){
  bg.classList.remove("active","l-effect");
  comments.forEach(x=>x.classList.remove("show"));
  void bg.offsetWidth;
  bg.classList.add("active");
  comments.forEach((x,i)=>{x.src=comment(i+1).src;setTimeout(()=>x.classList.add("show"),1100+i*350)})
}

const TURN=450,SQUASH=.9,HALF=225,EIN="cubic-bezier(.45,0,.25,1)",EOUT="cubic-bezier(.34,1.18,.64,1)";
let playing=false,sequence=[],position=0,currentName="";

function startAnimation(name){
  playing=false;
  image.getAnimations().forEach(a=>a.cancel());
  currentName=name;
  sequence=seqs[name]||[1,2];
  position=0;
  setFrame(sequence[0]);
  image.style.transform="scaleY(1)";
  flash.classList.remove("active");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{playing=true;animate()}))
}

function setFrame(v){
  if(currentName==="제로투"&&v!=="FLASH")updateSide(v);
  if(v==="FLASH")return triggerFlash();
  show(image,frame(currentName,v))
}

function updateSide(v){
  const s=v===1?"16%":"-16%";
  left.style.setProperty("--side-shift",s);
  right.style.setProperty("--side-shift",s)
}
function triggerFlash(){flash.classList.remove("active");void flash.offsetWidth;flash.classList.add("active")}
function explode(){explosion.classList.remove("active");void explosion.offsetWidth;explosion.classList.add("active")}

function animate(){
  if(!playing)return;
  const cur=sequence[position],next=sequence[(position+1)%sequence.length];
  if(currentName==="셀카"&&[2,"FLASH"].includes(cur)&&[2,"FLASH"].includes(next)){
    position=(position+1)%sequence.length;
    setFrame(next);
    image.style.transform="scaleY(1)";
    return setTimeout(animate,next==="FLASH"?120:0)
  }
  image.animate([{transform:"scaleY(1)"},{transform:`scaleY(${SQUASH})`}],{duration:HALF,easing:EIN,fill:"forwards"}).finished
  .then(()=>{
    if(!playing)return;
    image.style.transform=`scaleY(${SQUASH})`;
    position=(position+1)%sequence.length;
    setFrame(sequence[position]);
    return image.animate([{transform:`scaleY(${SQUASH})`},{transform:"scaleY(1)"}],{duration:HALF,easing:EOUT,fill:"forwards"}).finished
  })
  .then(()=>{if(playing){image.style.transform="scaleY(1)";animate()}})
  .catch(()=>{if(playing){image.style.transform="scaleY(1)";animate()}})
}
</script>
</body>
</html>
